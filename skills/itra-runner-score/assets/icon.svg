<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#17566F"/>
      <stop offset="0.5" stop-color="#0E3A50"/>
      <stop offset="1" stop-color="#08192B"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#FDBA74"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FB923C" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="118" ry="118"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- glow behind the summit -->
    <circle cx="440" cy="158" r="150" fill="url(#glow)"/>

    <!-- distant ridge -->
    <polyline points="36,392 104,340 158,372 224,316 282,352 344,296 404,326 476,268"
              fill="none" stroke="#FFFFFF" stroke-opacity="0.13"
              stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- elevation profile / index curve -->
    <polyline points="68,366 132,318 188,342 246,280 306,314 368,228 444,152"
              fill="none" stroke="url(#line)" stroke-width="22"
              stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="132" cy="318" r="8" fill="#FFF3E6" opacity="0.9"/>
    <circle cx="188" cy="342" r="8" fill="#FFF3E6" opacity="0.9"/>
    <circle cx="246" cy="280" r="8" fill="#FFF3E6" opacity="0.9"/>
    <circle cx="306" cy="314" r="8" fill="#FFF3E6" opacity="0.9"/>
    <circle cx="368" cy="228" r="8" fill="#FFF3E6" opacity="0.9"/>

    <!-- summit marker -->
    <circle cx="444" cy="152" r="30" fill="#F97316"/>
    <circle cx="444" cy="152" r="30" fill="none" stroke="#FFFFFF" stroke-width="11"/>
  </g>
</svg>
