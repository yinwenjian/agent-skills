<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1636"/>
      <stop offset="1" stop-color="#0b0e17"/>
    </linearGradient>
  </defs>
  <!-- 深色圆角底（与报告页配色一致） -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <!-- Git 分支标记（Git 官方橙 #F05032）：左上/左下/右上三个节点 + 竖线 + 圆角拐臂 -->
  <g stroke="#F05032" stroke-width="30" fill="none" stroke-linecap="round">
    <path d="M176 200 V312"/>
    <path d="M214 160 H286 Q336 160 336 210"/>
  </g>
  <g fill="#F05032">
    <circle cx="176" cy="160" r="40"/>
    <circle cx="176" cy="352" r="40"/>
    <circle cx="336" cy="228" r="40"/>
  </g>
  <!-- 年度报告柱状元素（沿用报告页三色） -->
  <g>
    <rect x="300" y="400" width="34" height="48" rx="8" fill="#50fa7b"/>
    <rect x="352" y="362" width="34" height="86" rx="8" fill="#8be9fd"/>
    <rect x="404" y="322" width="34" height="126" rx="8" fill="#bd93f9"/>
  </g>
</svg>
